\* Liveness: engines one at a time (Overlap = FALSE), each step fair; crashes and lost answers anywhere.
SPECIFICATION FairSpec
CONSTANTS
    Engines = {e1, e2, e3}
    MaxSeq = 5
    Nobody = Nobody
    Overlap = FALSE
    LostAnswers = TRUE
    FixF7 = TRUE
    KeepFences = TRUE
    FenceNonce = TRUE
    OwnBytes = TRUE
    FixF14 = FALSE
    FixF15 = FALSE
INVARIANT
    TypeOK NoAckedLoss OneWriter FencedSeesAcked StatesArePrefixes
    CountersDense CleanupCovered FencesStay OpensNeverFail
PROPERTY OpensAlone AppendsAlone
CHECK_DEADLOCK FALSE
