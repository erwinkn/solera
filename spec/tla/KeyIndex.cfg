\* KeyIndex.tla's base model: one consumer, three commits per life, six span files, one reset, one merge at a time; every rule as designed. check.sh's `model` makes the others.
SPECIFICATION Spec
CONSTANTS
    Consumers = {c1}
    MaxCommits = 3
    MaxFiles = 6
    MaxResets = 1
    MaxJobs = 1
    FixLanding = TRUE
    FixBounds = TRUE
    FixInputs = TRUE
    FixLife = TRUE
    FixPinFloor = TRUE
    FixDurable = TRUE
    FixAtomicPin = TRUE
INVARIANT Tiling ReadsExact StateStored ReadersStored
CHECK_DEADLOCK FALSE
