\* The journal as one object: liveness: engines one at a time, each step fair; crashes and lost answers anywhere, no 409s.
SPECIFICATION FairSpec
CONSTANTS
    Engines = {e1, e2, e3}
    MaxWrites = 7
    None = None
    Nobody = Nobody
    Overlap = FALSE
    LostAnswers = TRUE
    Conflicts = FALSE
    Unreadable = TRUE
    EngineId = TRUE
    AskJournal = TRUE
    ReGet = TRUE
    Verify = TRUE
    ListFirst = TRUE
INVARIANT
    TypeOK NoAckedLoss OneWriter FencedSeesAcked StatesArePrefixes
    JournalResolves OpensNeverFail
PROPERTY OpensAlone AppendsAlone
CHECK_DEADLOCK FALSE
