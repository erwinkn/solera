\* Positions.tla's base model: keys 1 and 2, two commits to S, two keys= runs, one deploy (A moved, or B changed), one read-ahead entry; B not each=True; every rule as designed. check.sh's `model` makes the others.
SPECIFICATION Spec
CONSTANTS
    NK = 2
    MaxSrc = 2
    MaxKeysRuns = 2
    MaxChanges = 1
    MaxEntries = 1
    Each = FALSE
    FixNet = TRUE
    FixTransitive = TRUE
    FixSkip = TRUE
    FixContinue = TRUE
    FixCollapse = TRUE
INVARIANT StatusExact DeliveredOnce
CHECK_DEADLOCK FALSE
