\* JournalObject.tla's base model: two engines, seven head writes, every fault. check.sh's `model` makes the others.
SPECIFICATION Spec
CONSTANTS
    Engines = {e1, e2}
    MaxWrites = 7
    None = None
    Nobody = Nobody
    Overlap = TRUE
    LostAnswers = TRUE
    Conflicts = TRUE
    Unreadable = TRUE
    EngineId = TRUE
    AskJournal = TRUE
    ReGet = TRUE
    Verify = TRUE
    ListFirst = TRUE
SYMMETRY Symmetry
INVARIANT TypeOK NoAckedLoss OneWriter FencedSeesAcked StatesArePrefixes JournalResolves OpensNeverFail
PROPERTY Monotonic
CHECK_DEADLOCK FALSE
