\* The journal as one object: three engines, six head writes, every fault.
SPECIFICATION Spec
CONSTANTS
    Engines = {e1, e2, e3}
    MaxWrites = 6
    None = None
    Nobody = Nobody
    Overlap = TRUE
    LostAnswers = TRUE
    Conflicts = TRUE
    Unreadable = TRUE
    EngineId = TRUE
    AskJournal = TRUE
    ReGet = TRUE
    Verify = TRUE
    ListFirst = TRUE
SYMMETRY Symmetry
INVARIANT
    TypeOK NoAckedLoss OneWriter FencedSeesAcked StatesArePrefixes
    JournalResolves OpensNeverFail
PROPERTY Monotonic
CHECK_DEADLOCK FALSE
