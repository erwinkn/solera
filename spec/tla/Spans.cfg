\* Spans.tla's base model: one consumer, three commits per life, six span files, one claim, one reset, no takeover, one merge at a time, no failed merges, no empty spans, no passes, no orphan collector; every guard on. check.sh's `model` makes the others.
SPECIFICATION Spec
CONSTANTS
    Consumers = {c1}
    MaxCommits = 3
    MaxFiles = 6
    MaxResets = 1
    MaxTakeovers = 0
    MaxClaims = 1
    MaxJobs = 1
    R = 3
    MergeFailures = FALSE
    EmptySpans = FALSE
    Passes = FALSE
    Collectors = FALSE
    FixLanding = TRUE
    FixBounds = TRUE
    FixLanes = TRUE
    FixInputs = TRUE
    FixLife = TRUE
    FixSettleLife = TRUE
    FixPinFloor = TRUE
    FixDurable = TRUE
    FixRetries = TRUE
    FixEpoch = TRUE
    FixJudgeAfter = TRUE
    FixGarbageNamed = TRUE
INVARIANT Tiling ReadsExact StateStored ReadersStored PublishingStored AttemptsBounded
CHECK_DEADLOCK FALSE
