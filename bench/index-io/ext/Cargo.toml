[package]
name = "index-io-bench"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "index_io_bench"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
object_store = { version = "0.14", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
futures = "0.3"
bytes = "1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
