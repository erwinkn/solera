[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cursus"
version = "0.0.1"
description = "Asset-first orchestration on object storage: SDK, worker, and control plane"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "croniter>=6,<7",
    "httpx>=0.28,<1",
    "slatedb==0.16.0",
    "obstore==0.11.1",
    "xxhash>=3,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
postgres = [
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
cursus = "cursus_server.cli:main"

[project.urls]
Repository = "https://github.com/erwinkn/cursus"

[tool.uv]
package = true

# One distribution ("cursus") bundles the three source trees: the asset SDK
# (`cursus`), the worker (`cursus_worker`), and the control plane with its
# committed console bundle (`cursus_server`).
[tool.hatch.build.targets.wheel]
packages = [
    "packages/sdk/src/cursus",
    "packages/sdk/src/cursus_postgres",
    "apps/server/src/cursus_server",
    "apps/worker/src/cursus_worker",
]

[tool.hatch.build.targets.sdist]
include = [
    "packages/sdk/src/cursus",
    "packages/sdk/src/cursus_postgres",
    "apps/server/src/cursus_server",
    "apps/worker/src/cursus_worker",
    "README.md",
]

[dependency-groups]
dev = ["maturin>=1.7,<2", "pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1", "moto[server,s3]>=5,<6", "boto3>=1.36,<2", "pandas>=2.2,<3", "psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "s3: requires an S3-compatible HTTP endpoint",
    "live: requires an explicitly supplied isolated test bucket",
    "postgres: requires CURSUS_TEST_DATABASE_URL (docker compose up postgres)",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]