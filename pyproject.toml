[project]
name = "data-orchestrator-workspace"
version = "0.2.0a1"
description = "Workspace root for the data-orchestrator monorepo"
requires-python = ">=3.12"
dependencies = [
    "data-orchestrator-server",
    "data-orchestrator-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/sdk", "apps/worker", "apps/server"]

[tool.uv.sources]
data-orchestrator-server = { workspace = true }
data-orchestrator-worker = { workspace = true }
data-orchestrator = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1", "moto[server,s3]>=5,<6", "boto3>=1.36,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "s3: requires an S3-compatible HTTP endpoint",
    "live: requires an explicitly supplied isolated test bucket",
    "postgres: requires DORC_TEST_DATABASE_URL (docker compose up postgres)",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
