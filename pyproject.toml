[project]
name = "cursus-workspace"
version = "0.0.1"
description = "Workspace root for the cursus monorepo"
requires-python = ">=3.12"
dependencies = [
    "cursus-server",
    "cursus-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/sdk", "apps/worker", "apps/server"]

[tool.uv.sources]
cursus-server = { workspace = true }
cursus-worker = { workspace = true }
cursus = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1", "moto[server,s3]>=5,<6", "boto3>=1.36,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["s3: requires an S3-compatible HTTP endpoint", "live: requires an explicitly supplied isolated test bucket"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
