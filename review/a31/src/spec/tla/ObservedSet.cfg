\* ObservedSet.tla's base model: free exploration of three keys (two groups and one more), two versions, three commits per life, one upstream reset, one definition change, a versioned store, per-key cancels; every rule on. check.sh's `model` makes the others, histories included.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxVer = 2
    MaxCommits = 3
    MaxResets = 1
    MaxDefs = 1
    Pats = {{}, {"a"}, {"a", "b"}}
    Ctxs = {"w1", "w2"}
    Cap = 1
    CurrentOnly = FALSE
    PerKey = TRUE
    History = "free"
    FixDecodeOld = TRUE
    FixRecheck = TRUE
    FixPointPatterns = TRUE
    FixAbsentPoints = TRUE
    FixObserve = TRUE
    FixNoCap = TRUE
    FixFold = TRUE
    FixSupersede = TRUE
    FixSplit = TRUE
    FixRelabel = TRUE
    FixRebase = TRUE
    FixContext = TRUE
    FixUniversal = TRUE
    FixClassOnce = TRUE
    FixLives = TRUE
    FixRangeCands = TRUE
    FixPending = TRUE
    FixImage = TRUE
    FixClaimPin = TRUE
    FixCommitCheck = TRUE
INVARIANT DecodeExact CountExact TallyExact OwedExact StaleExact RowsKept EndpointsKept Admitted Through
CONSTRAINT Bounded
CHECK_DEADLOCK FALSE
