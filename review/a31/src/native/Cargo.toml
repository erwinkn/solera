[package]
name = "solera-native"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "solera._native: the .kx key index format"
publish = false

[lib]
name = "solera_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32fast = "1"
rayon = "1"
zstd = "0.13"  # codec 2 (W53 prototype, branch exp/key-index-two-views)
arrow-array = { version = "60", default-features = false, features = ["ffi"] }
arrow-schema = "60"
arrow-buffer = "60"

[profile.release]
lto = "thin"
codegen-units = 1
