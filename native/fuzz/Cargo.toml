[package]
name = "solera-native-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets on the .lay readers (docs/verification.md, \"Fuzzing\")"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
solera-native = { path = ".." }

[workspace]

[[bin]]
name = "lay-file"
path = "fuzz_targets/lay_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lay-round-trip"
path = "fuzz_targets/lay_round_trip.rs"
test = false
doc = false
bench = false
