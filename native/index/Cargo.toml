[package]
name = "solera-index"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
bytes = "1"
futures = "0.3"
object_store = { version = "0.14", features = ["aws"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util"] }
url = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[dev-dependencies]
rand = { version = "0.9", features = ["small_rng"] }
