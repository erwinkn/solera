[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cursus-server"
version = "0.0.1"
description = "Control plane: API, engine, storage, and console for cursus"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cursus",
    "cursus-worker",
    "slatedb==0.16.0",
    "obstore==0.11.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "croniter>=6,<7",
]

[project.scripts]
cursus = "cursus_server.cli:main"

[tool.uv.sources]
cursus = { workspace = true }
cursus-worker = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cursus_server"]
