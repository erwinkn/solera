[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cursus-worker"
version = "0.0.1"
description = "Worker service: task execution core and control-plane agent"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cursus",
    "httpx>=0.28,<1",
]

[tool.uv.sources]
cursus = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cursus_worker"]
