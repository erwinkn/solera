name: Publish to PyPI

# Publishes cursus, cursus-worker, and cursus-server with Trusted Publishing.
# No API token is stored: the publish job exchanges a GitHub OIDC token for a
# short-lived PyPI token that is scoped to every project with a matching
# Trusted Publisher (all three share this repository, workflow, and environment).
#
# PyPI-side setup (once, per project):
#   https://pypi.org/manage/account/publishing/
#     PyPI Project Name: cursus | cursus-server | cursus-worker
#     Owner:             erwinkn
#     Repository name:   cursus
#     Workflow name:     publish.yml
#     Environment name:  pypi
#
# Then push a version tag (e.g. `v0.0.1`) or run this workflow manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          python-version: "3.12"
      - name: Build all workspace distributions
        run: |
          rm -rf dist
          uv build --package cursus
          uv build --package cursus-worker
          uv build --package cursus-server
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1