name: Verify object-backed engine
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s3-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/console/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm -C apps/console typecheck && pnpm -C apps/console build
      - run: uv sync --locked
      - run: uv run ruff check apps packages tests && uv run ruff format --check apps packages tests
      - run: uv run pytest -q -m 'not live' --junitxml=test-results.xml
      - run: uv build --wheel
      - name: Verify packaged console and native probe
        run: |
          uv run python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          with ZipFile(glob('dist/cursus-*.whl')[0]) as z:
              names = z.namelist()
              assert 'cursus/__init__.py' in names
              assert 'cursus_worker/__main__.py' in names
              assert 'cursus_server/web/index.html' in names
              assert 'cursus_server/selftest.py' in names
              assert any(n.startswith('cursus_server/web/assets/') and n.endswith('.js') for n in names), 'no bundled JS in wheel'
              assert any(n.startswith('cursus_server/web/assets/') and n.endswith('.css') for n in names), 'no bundled CSS in wheel'
          PY
          uv run cursus --state-url file:///tmp/ci-native-probe selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-verification
          path: |
            test-results.xml
            dist/
  native:
    # The Rust key index extension: its own tests, then the key index suite
    # against both implementations — native, and the pure-Python reference.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - run: uv sync --locked
      - run: cargo fmt --check --manifest-path packages/native/Cargo.toml && cargo test --release --manifest-path packages/native/Cargo.toml
      - run: uv run maturin develop --release -m packages/native/Cargo.toml
      - run: uv run python -c "import cursus.keys as k; assert k.IMPL == 'native', k.IMPL"
      - run: uv run pytest -q tests/sdk/test_keys_format.py tests/sdk/test_keys_index.py
      - run: CURSUS_KEYS_IMPL=python uv run pytest -q tests/sdk/test_keys_index.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/console/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile && pnpm -C apps/console audit --audit-level=high
      - run: pnpm -C apps/console exec playwright install --with-deps chromium
      - run: pnpm -C apps/console test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: apps/console/test-results/
