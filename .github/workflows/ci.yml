name: Verify object-backed engine
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s3-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run pytest -q -m 'not live' --junitxml=test-results.xml
      - run: uv build --wheel
      - name: Verify packaged console and native probe
        run: |
          uv run python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          with ZipFile(glob('dist/*.whl')[0]) as z:
              for name in ['web/index.html', 'web/app.js', 'web/style.css', 'selftest.py']:
                  assert 'data_orchestrator/' + name in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-verification
          path: |
            test-results.xml
            dist/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked
      - run: npm ci && npm audit --audit-level=high
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm test
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: ui/test-results/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DORC_API_TOKEN: local-ci-token-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose exec -T orchestrator dorc selftest --state-url file:///tmp/container-probe
      - if: always()
        run: docker compose logs --no-color && docker compose down --volumes
