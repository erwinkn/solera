name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/console/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        ports: ['5432:5432']
        env:
          POSTGRES_USER: solera
          POSTGRES_PASSWORD: solera
          POSTGRES_DB: solera
        options: >-
          --health-cmd "pg_isready -U solera"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SOLERA_TEST_DATABASE_URL: postgresql://solera:solera@127.0.0.1:5432/solera
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: cargo fmt --check --manifest-path native/Cargo.toml
      - run: cargo test --release --manifest-path native/Cargo.toml
      - run: uv run pytest -q -m 'not live'
