name: Verify object-backed engine
on:
  push:
    branches: [feat/s3-state-backend]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s3-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync
      - run: uv run python -m compileall -q src tests
      - run: uv run ruff check --select E9,F63,F7,F82 src tests
      - run: uv run pytest -q -m 'not live' --junitxml=test-results.xml
      - run: uv build --wheel
      - name: Check packaged console
        run: |
          uv run python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          with ZipFile(glob('dist/*.whl')[0]) as z:
              assert 'data_orchestrator/web/index.html' in z.namelist()
              assert 'data_orchestrator/web/app.js' in z.namelist()
              assert 'data_orchestrator/selftest.py' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-verification
          path: |
            test-results.xml
            uv.lock
            dist/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync
      - run: npm install
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm test
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            ui/test-results/
            ui/package-lock.json
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orchestrator-test .
      - run: docker run --rm orchestrator-test dorc selftest --state-url file:///tmp/test-objects
