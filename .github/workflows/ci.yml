name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/console/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
          enable-cache: true
      - run: cargo fmt --check --manifest-path native/Cargo.toml
      - run: cargo check --manifest-path native/Cargo.toml
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # ty finds the .venv that uv sync built. It becomes blocking (drop continue-on-error)
      # once the type errors it reports are fixed.
      - run: uvx ty@0.0.84 check
        continue-on-error: true
      - run: uv run pytest -q -m 'not live and not postgres and not s3'
