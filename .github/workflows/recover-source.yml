name: Recover preserved source
on:
  push:
    branches: [feat/s3-state-backend]
    paths: [.github/workflows/recover-source.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover and verify preserved source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          parts = ['6c155bf02403160011145063c28580b7320a2b66', 'fae88efbca0c7a4766ea4ed72a027aa7344f6979', '485257a8fc939771184eed8ad432b8f96b552165', '4a9b1c7d75740bc4c50cb976d0c2c617cc8c3c8f']
          archive = bytearray()
          for sha in parts:
              req = urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPO"]}/git/blobs/{sha}', headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}'})
              with urllib.request.urlopen(req) as response:
                  archive.extend(base64.b64decode(json.load(response)['content']))
          assert hashlib.sha256(archive).hexdigest() == '490f6daa241dfd94d20e9efaa831ba18231f57850f51208902b3bfa2d9e6efa8'
          pathlib.Path('implementation.tar.xz').write_bytes(archive)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preserved-source
          path: implementation.tar.xz
          retention-days: 3
