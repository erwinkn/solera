name: Final review and verified publication
on:
  push:
    branches: [feat/s3-state-backend]
    paths: [.github/workflows/refine-source.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'erwinkn/data-orchestrator' && github.ref == 'refs/heads/feat/s3-state-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/review_patch.py
      - run: uv sync --locked
      - run: uv run ruff check --fix src tests && uv run ruff format src tests
      - run: uv run pytest -q -m 'not live' --junitxml=test-results.xml
      - run: npm ci && npm audit --audit-level=high
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: uv build --wheel
      - name: Verify Docker and fresh filesystem volume
        env:
          DORC_API_TOKEN: test-ci-local-only
        run: |
          docker compose up --build --wait --wait-timeout 180
          docker compose exec -T orchestrator dorc selftest --state-url file:///tmp/review-selftest
          docker compose down --volumes
      - name: Publish verified refinements and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-source.yml scripts/review_patch.py
          git add src tests README.md docs
          git commit -m 'fix: preserve transitive inventory completeness and harden worker protocol; verify regressions'
          git push origin HEAD:refs/heads/feat/s3-state-backend
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-review-verification
          path: |
            test-results.xml
            ui/test-results/
            dist/
