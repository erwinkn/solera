name: data-orchestrator
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_DB: orchestrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DORC_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    init: true
    environment:
      DORC_DATABASE_URL: postgresql://orchestrator:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/orchestrator
      DORC_API_TOKEN: ${DORC_API_TOKEN:-}
      DORC_ENTRYPOINT: ${DORC_ENTRYPOINT:-examples.lab:definitions}
    command:
      - sh
      - -c
      - 'dorc migrate && dorc register "$$DORC_ENTRYPOINT" && exec dorc serve --host 0.0.0.0 --allow-unauthenticated'
    ports:
      - "127.0.0.1:${DORC_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
