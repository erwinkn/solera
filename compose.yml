services:
  postgres:
    image: postgres:17
    ports: ['127.0.0.1:5432:5432']
    environment:
      POSTGRES_USER: solera
      POSTGRES_PASSWORD: solera
      POSTGRES_DB: solera
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solera']
      interval: 3s
      timeout: 3s
      retries: 20
  solera:
    build: .
    ports: ['127.0.0.1:8000:8000']
    environment:
      SOLERA_STATE_URL: file:///home/app/state
      SOLERA_API_TOKEN: ${SOLERA_API_TOKEN:?Set a local API token before starting Compose}
      DATABASE_URL: postgresql://solera:solera@postgres:5432/solera
    volumes:
      - objects:/home/app/state
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  objects:
