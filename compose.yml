services:
  postgres:
    image: postgres:17
    ports: ['127.0.0.1:5432:5432']
    environment:
      POSTGRES_USER: dorc
      POSTGRES_PASSWORD: dorc
      POSTGRES_DB: dorc
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dorc']
      interval: 3s
      timeout: 3s
      retries: 20
  orchestrator:
    build: .
    ports: ['127.0.0.1:8000:8000']
    environment:
      DORC_STATE_URL: file:///home/app/state
      DORC_API_TOKEN: ${DORC_API_TOKEN:?Set a local API token before starting Compose}
      DATABASE_URL: postgresql://dorc:dorc@postgres:5432/dorc
    volumes:
      - objects:/home/app/state
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  objects:
