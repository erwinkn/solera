[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "data-orchestrator"
version = "0.2.0a1"
description = "Asset SDK and project runtime for the data orchestrator"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "croniter>=6,<7",
]

[project.optional-dependencies]
postgres = [
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_orchestrator", "src/dorc_postgres"]
