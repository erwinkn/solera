[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cursus"
version = "0.0.1"
description = "Asset SDK and project runtime for cursus"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "croniter>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cursus"]
