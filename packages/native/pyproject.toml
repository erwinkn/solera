[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "solera-native"
version = "0.0.1"
description = "Native acceleration for solera: the .kx key index format"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.maturin]
module-name = "solera_native"
features = ["extension-module"]
