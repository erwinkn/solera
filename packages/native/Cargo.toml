[package]
name = "cursus-native"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Native acceleration for cursus: the .kx key index format"
publish = false

[lib]
name = "cursus_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32fast = "1"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
